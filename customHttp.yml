customHeaders:
  - pattern: "**.@(jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "**.@(js|css)"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: /*
    headers:
      - key: Cache-Control
        value: max-age=0, s-maxage=3600, must-revalidate

