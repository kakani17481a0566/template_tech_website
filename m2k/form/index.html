<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent/Guardian Consent Form</title>
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background-color: #f4f7fb;
      color: #333;
      padding: 40px;
    }
    .form-container {
      background: white;
      padding: 50px 60px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.8;
      font-size: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 2px solid #042562;
      padding-bottom: 20px;
    }
    .logo-left img, .logo-right img {
      max-height: 80px;
      object-fit: contain;
    }
    h2 {
      text-align: center;
      color: #042562;
      margin-top: 0;
      margin-bottom: 40px;
      font-size: 26px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .content p {
      margin-bottom: 25px;
      line-height: 2.2;
    }
    input[type="text"], select {
      border: none;
      border-bottom: 1px solid #333;
      background: transparent;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      padding: 0 5px;
      text-align: center;
      color: #042562;
      font-weight: 600;
    }
    .input-small { width: 80px; }
    .input-medium { width: 140px; }
    .input-large { width: 220px; }
    .input-xlarge { width: 300px; }
    
    .consent-list {
      list-style-type: none;
      padding-left: 0;
      margin-top: 10px;
      margin-bottom: 40px;
    }
    .consent-list li {
      margin-bottom: 20px;
    }
    .consent-list label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      line-height: 1.6;
    }
    .consent-list input[type="checkbox"] {
      margin-top: 6px;
      min-width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .signature-section {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
    }
    .sig-box {
      width: 40%;
    }
    .sig-line {
      border-bottom: 1px solid #333;
      height: 40px;
      margin-bottom: 10px;
    }
    .btn {
      background-color: #042562;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      width: 100%;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #031a47;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #042562;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
      font-family: inherit;
    }
    @media print {
      body { background-color: white; padding: 0; }
      .form-container { box-shadow: none; max-width: 100%; padding: 0; }
      #email-verification { display: none !important; }
      #main-form { display: block !important; }
    }
  </style>
</head>
<body>

  <!-- Email Verification Step -->
  <div class="form-container" id="email-verification">
    <h2>Email Verification</h2>
    <p style="text-align: center; margin-bottom: 30px;">Please verify your email address to access the consent form.</p>
    
    <div id="step-email">
      <div class="form-group">
        <label for="userEmail">Email Address</label>
        <input type="email" id="userEmail" placeholder="Enter your email" required>
      </div>
      <button class="btn" onclick="sendOTP()">Send OTP</button>
    </div>

    <div id="step-otp" style="display: none;">
      <div class="form-group">
        <label for="otpCode">Verification Code</label>
        <input type="text" id="otpCode" placeholder="Enter 4-digit code (e.g., 1234)" required>
      </div>
      <button class="btn" onclick="verifyOTP()">Verify & Proceed</button>
    </div>
  </div>

  <!-- Main Consent Form -->
  <div class="form-container" id="main-form" style="display: none;">
    <div class="header">
      <div class="logo-left">
        <img src="../../images/tagline_with_daycare4x.png" alt="Left Logo">
      </div>
      <div class="logo-right">
        <img src="../../images/MSI_written_one_line-min-33.png" alt="Right Logo">
      </div>
    </div>
    
    <h2>Parent/Guardian Consent</h2>
    
    <div class="content">
      <p>
        I, <input type="text" class="input-xlarge" aria-label="Parent/Guardian Full Name">, 
        parent/guardian of <input type="text" class="input-xlarge" aria-label="Child Full Name"> (child's name), 
        studying in Grade <input type="text" class="input-small" aria-label="Grade"> of My School ITALY, 
        <select class="input-large" aria-label="Centre Name" required>
          <option value="" disabled selected></option>
          <option value="Avance 1">Avance 1</option>
          <option value="Avance 2">Avance 2</option>
          <option value="Commissioner Office">Commissioner Office</option>
          <option value="Hitex">Hitex</option>
          <option value="Kukatpally">Kukatpally</option>
          <option value="Mani Konda">Mani Konda</option>
          <option value="Mindspace">Mindspace</option>
          <option value="Miyapur">Miyapur</option>
          <option value="Q-city">Q-city</option>
          <option value="Kondapur">Kondapur</option>
        </select> (centre name),
        give my consent for my child:
      </p>
      
      <ul class="consent-list">
        <li>
          <label>
            <input type="checkbox" required>
            <span>To participate in the Independence Day Celebration at H06 Phoenix Avance Business Hub, Hitech City, Hyderabad on 10th August 2026 and to travel with the school from the centre at 10 am to the venue and back to the centre by 1:30 pm.</span>
          </label>
        </li>
        <li>
          <label>
            <input type="checkbox" required>
            <span>To have healthy snacks according to the menu prepared by Inspire Me Eat and is sent to me.</span>
          </label>
        </li>
        <li>
          <label>
            <input type="checkbox" required>
            <span>To be covered in photos and videos which could also be covered in various school groups and social media.</span>
          </label>
        </li>
      </ul>
      
      <div class="signature-section">
        <div class="sig-box">
          <input type="text" style="width: 100%; margin-bottom: 10px;" aria-label="Signature">
          <div>Parent/Guardian Signature</div>
        </div>
        <div class="sig-box">
          <input type="text" id="currentDate" style="width: 100%; margin-bottom: 10px;" required aria-label="Date" readonly>
          <div>Date</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const dateField = document.getElementById("currentDate");
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      dateField.value = `${dd}-${mm}-${yyyy}`;
    });

    function sendOTP() {
      const email = document.getElementById("userEmail").value;
      if (!email || !email.includes('@')) {
        alert("Please enter a valid email address.");
        return;
      }
      alert("Mock Verification Code sent to " + email + "\n\nCode: 1234");
      document.getElementById("step-email").style.display = "none";
      document.getElementById("step-otp").style.display = "block";
    }

    function verifyOTP() {
      const code = document.getElementById("otpCode").value;
      if (code === "1234") {
        document.getElementById("email-verification").style.display = "none";
        document.getElementById("main-form").style.display = "block";
      } else {
        alert("Invalid code. Please enter 1234.");
      }
    }
  </script>
</body>
</html>
