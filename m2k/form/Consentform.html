<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent/Guardian Consent Form</title>
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background-color: #f4f7fb;
      color: #333;
      padding: 40px;
    }
    .form-container {
      background: white;
      padding: 50px 60px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.8;
      font-size: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 2px solid #042562;
      padding-bottom: 20px;
    }
    .logo-left img, .logo-right img {
      max-height: 80px;
      object-fit: contain;
    }
    h2 {
      text-align: center;
      color: #042562;
      margin-top: 0;
      margin-bottom: 40px;
      font-size: 26px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .content p {
      margin-bottom: 25px;
      line-height: 2.2;
    }
    input[type="text"], select {
      border: none;
      border-bottom: 1px solid #333;
      background: transparent;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      padding: 0 5px;
      text-align: center;
      color: #042562;
      font-weight: 600;
    }
    .input-small { width: 80px; }
    .input-medium { width: 140px; }
    .input-large { width: 220px; }
    .input-xlarge { width: 300px; }
    
    .consent-list {
      list-style-type: none;
      padding-left: 0;
      margin-top: 10px;
      margin-bottom: 40px;
    }
    .consent-list li {
      margin-bottom: 20px;
    }
    .consent-list label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      line-height: 1.6;
    }
    .consent-list input[type="checkbox"] {
      margin-top: 6px;
      min-width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .signature-section {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
    }
    .sig-box {
      width: 40%;
    }
    .sig-line {
      border-bottom: 1px solid #333;
      height: 40px;
      margin-bottom: 10px;
    }
    .btn {
      background-color: #042562;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      width: 100%;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #031a47;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #042562;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
      font-family: inherit;
    }
    @media print {
      body { background-color: white; padding: 0; }
      .form-container { box-shadow: none; max-width: 100%; padding: 0; }
      #email-verification { display: none !important; }
      #main-form { display: block !important; }
    }
  </style>
</head>
<body>

  <!-- Email Verification Step -->
  <div class="form-container" id="email-verification">
    <h2>Email Verification</h2>
    <p style="text-align: center; margin-bottom: 30px;">Please verify your email address to access the consent form.</p>
    
    <div id="step-email">
      <div class="form-group">
        <label for="userEmail">Email Address</label>
        <input type="email" id="userEmail" placeholder="Enter your email" required>
      </div>
      <button class="btn" onclick="sendOTP()">Send OTP</button>
    </div>

    <div id="step-otp" style="display: none;">
      <div class="form-group">
        <label for="otpCode">Verification Code</label>
        <input type="text" id="otpCode" placeholder="Enter 4-digit code (e.g., 1234)" required>
      </div>
      <button class="btn" onclick="verifyOTP()">Verify & Proceed</button>
    </div>
  </div>

  <!-- Main Consent Form -->
  <form class="form-container" id="main-form" style="display: none;" onsubmit="submitForm(event)">
    <input type="hidden" id="verifiedEmailInput" name="parent_email">
    <div class="header">
      <div class="logo-left">
        <img src="../../images/tagline_with_daycare4x.png" alt="Left Logo" data-cache="true">
      </div>
      <div class="logo-right">
        <img src="../../images/MSI_written_one_line-min-33.png" alt="Right Logo" data-cache="true">
      </div>
    </div>
    
    <h2>Parent/Guardian Consent</h2>
    
    <div class="content">
      <p>
        I, <input type="text" name="parent_name" class="input-xlarge" aria-label="Parent/Guardian Full Name" required>, 
        parent/guardian of <input type="text" name="child_name" class="input-xlarge" aria-label="Child Full Name" required> (child's name), 
        studying in Grade <input type="text" name="grade" class="input-small" aria-label="Grade" required> of My School ITALY, 
        <select class="input-large" name="centre_name" aria-label="Centre Name" required>
          <option value="" disabled selected></option>
          <option value="Avance 1">Avance 1</option>
          <option value="Avance 2">Avance 2</option>
          <option value="Commissioner Office">Commissioner Office</option>
          <option value="Hitex">Hitex</option>
          <option value="Kukatpally">Kukatpally</option>
          <option value="Mani Konda">Mani Konda</option>
          <option value="Mindspace">Mindspace</option>
          <option value="Miyapur">Miyapur</option>
          <option value="Q-city">Q-city</option>
          <option value="Kondapur">Kondapur</option>
        </select> (centre name),
        give my consent for my child:
      </p>
      
      <ul class="consent-list">
        <li>
          <label>
            <input type="checkbox" name="consent_participation" required>
            <span>To participate in the Independence Day Celebration at H06 Phoenix Avance Business Hub, Hitech City, Hyderabad on 10th August 2026 and to travel with the school from the centre at 10 am to the venue and back to the centre by 1:30 pm.</span>
          </label>
        </li>
        <li>
          <label>
            <input type="checkbox" name="consent_snacks" required>
            <span>To have healthy snacks according to the menu prepared by Inspire Me Eat and is sent to me.</span>
          </label>
        </li>
        <li>
          <label>
            <input type="checkbox" name="consent_media" required>
            <span>To be covered in photos and videos which could also be covered in various school groups and social media.</span>
          </label>
        </li>
      </ul>
      
      <div class="signature-section">
        <div class="sig-box">
          <input type="text" name="signature_name" style="width: 100%; margin-bottom: 10px;" aria-label="Signature" required>
          <div>Parent/Guardian Signature</div>
        </div>
        <div class="sig-box">
          <input type="text" id="currentDate" name="submission_date" style="width: 100%; margin-bottom: 10px;" required aria-label="Date" readonly>
          <div>Date</div>
        </div>
      </div>
      <button type="submit" class="btn" style="margin-top: 40px;">Submit Consent Form</button>
    </div>
  </form>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const dateField = document.getElementById("currentDate");
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      dateField.value = `${dd}-${mm}-${yyyy}`;

      // Image caching logic
      const imagesToCache = document.querySelectorAll('img[data-cache="true"]');
      imagesToCache.forEach(img => {
        const originalSrc = img.getAttribute('src');
        const storageKey = 'imgCache_' + btoa(originalSrc);
        const cachedData = sessionStorage.getItem(storageKey);
        
        if (cachedData) {
          img.src = cachedData;
        } else {
          fetch(originalSrc)
            .then(response => response.blob())
            .then(blob => {
              const reader = new FileReader();
              reader.onloadend = function() {
                try {
                  sessionStorage.setItem(storageKey, reader.result);
                } catch (e) {
                  console.warn('Session storage full or error');
                }
              }
              reader.readAsDataURL(blob);
            })
            .catch(err => console.error('Error caching image', err));
        }
      });
    });

    const BASE_URL = "https://neuropi-crm-api.azurewebsites.net/api/ConsentForm";

    async function sendOTP() {
      const email = document.getElementById("userEmail").value;
      if (!email || !email.includes('@')) {
        alert("Please enter a valid email address.");
        return;
      }
      
      const btn = document.querySelector("#step-email button");
      btn.textContent = "Sending...";
      btn.disabled = true;

      try {
        const response = await fetch(`${BASE_URL}/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email })
        });

        if (response.ok) {
          alert("Verification Code sent to " + email);
          document.getElementById("step-email").style.display = "none";
          document.getElementById("step-otp").style.display = "block";
        } else {
          alert("Failed to send OTP. Please try again.");
        }
      } catch (error) {
        console.error("Error sending OTP:", error);
        alert("Network error. Please check your connection.");
      } finally {
        btn.textContent = "Send OTP";
        btn.disabled = false;
      }
    }

    async function verifyOTP() {
      const code = document.getElementById("otpCode").value;
      const email = document.getElementById("userEmail").value;
      
      if (!code) {
        alert("Please enter the verification code.");
        return;
      }

      const btn = document.querySelector("#step-otp button");
      btn.textContent = "Verifying...";
      btn.disabled = true;

      try {
        const response = await fetch(`${BASE_URL}/verify-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, otpCode: code })
        });

        if (response.ok) {
          document.getElementById("verifiedEmailInput").value = email;
          document.getElementById("email-verification").style.display = "none";
          document.getElementById("main-form").style.display = "block";
        } else {
          alert("Invalid or expired code. Please try again.");
        }
      } catch (error) {
        console.error("Error verifying OTP:", error);
        alert("Network error. Please check your connection.");
      } finally {
        btn.textContent = "Verify & Proceed";
        btn.disabled = false;
      }
    }

    async function submitForm(event) {
      event.preventDefault(); // Prevent standard page reload

      const form = document.getElementById('main-form');
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      
      // Convert checkbox 'on' values to booleans
      data.consent_participation = !!data.consent_participation;
      data.consent_snacks = !!data.consent_snacks;
      data.consent_media = !!data.consent_media;

      // Convert date format from dd-mm-yyyy to yyyy-MM-dd for the .NET DateOnly backend
      if (data.submission_date) {
        const parts = data.submission_date.split('-');
        if (parts.length === 3) {
          data.submission_date = `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
      }

      // Call the actual backend endpoint
      const API_ENDPOINT = "https://neuropi-crm-api.azurewebsites.net/api/ConsentForm/CreateConsentForm";

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          if (confirm("Success! The consent form has been submitted for this child.\n\nDo you need to submit a consent form for ANOTHER child?")) {
            // They want to add another child. Clear only the child-specific fields.
            form.elements['child_name'].value = '';
            form.elements['grade'].value = '';
            form.elements['consent_participation'].checked = false;
            form.elements['consent_snacks'].checked = false;
            form.elements['consent_media'].checked = false;
            
            // Scroll to top of the form so they see the empty child name field
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            // They are completely done. Reset everything to the beginning.
            form.reset();
            document.getElementById("main-form").style.display = "none";
            document.getElementById("email-verification").style.display = "block";
            document.getElementById("step-otp").style.display = "none";
            document.getElementById("step-email").style.display = "block";
            document.getElementById("userEmail").value = "";
          }
        } else {
          alert("There was an error submitting the form. Please try again.");
        }
      } catch (error) {
        console.error("Error submitting form:", error);
        alert("Network error. Please check your connection and try again.");
      }
    }
  </script>
</body>
</html>
